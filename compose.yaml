services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: my_ple
      POSTGRES_USER: my_ple
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-my_ple_local}
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U my_ple -d my_ple"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    env_file:
      - path: ${BACKEND_ENV_FILE:-./backend/.env}
        required: false
    environment:
      DATABASE_URL: "host=db port=5432 user=my_ple password=${POSTGRES_PASSWORD:-my_ple_local} dbname=my_ple sslmode=disable"
      PORT: "3000"
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      UPLOAD_DIR: /app/upload
      WEEKLY_REPORT_STORAGE_DIR: /app/storage/weekly-reports
      ATTENDANCE_OFFICE_LATITUDE: ${ATTENDANCE_OFFICE_LATITUDE:--6.896211064380826}
      ATTENDANCE_OFFICE_LONGITUDE: ${ATTENDANCE_OFFICE_LONGITUDE:-107.69234020127173}
    expose:
      - "3000"
    volumes:
      - uploads:/app/upload
      - reports:/app/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-3000}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    environment:
      ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:3000"
    depends_on:
      nginx:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres18_data:
  uploads:
  reports:
