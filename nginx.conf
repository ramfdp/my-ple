server {
    listen 80;

    location /uploads/ {
        alias /app/upload/;
    }

    location / {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/users/[a-f0-9-]+/avatar$ {
        client_max_body_size 1m;
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
