# Production only: the backend reaches Worker through a dedicated private network.
services:
  backend:
    environment:
      APP_ENV: production
      COOKIE_SECURE: "true"
      AI_SNAPSHOT_ENABLED: "true"
      AI_SERVICE_TOKEN_FILE: /run/secrets/ai_service_token
      AI_ALLOWED_WORKSPACE_IDS: ${AI_PRODUCTION_ALLOWED_WORKSPACE_IDS:?set production workspace grants}
      AI_IMPORT_ENABLED: "true"
      AI_IMPORT_TOKEN_FILE: /run/secrets/ai_import_token
      AI_IMPORT_ALLOWED_WORKSPACE_IDS: ${AI_PRODUCTION_ALLOWED_WORKSPACE_IDS:?set production import workspace grants}
      HERMES_CHAT_ENABLED: "true"
      HERMES_CHAT_TOKEN_FILE: /run/secrets/hermes_chat_token
    volumes:
      - ${AI_PRODUCTION_BACKEND_TOKEN_FILE:?set private backend token path}:/run/secrets/ai_service_token:ro
      - ${AI_PRODUCTION_BACKEND_IMPORT_TOKEN_FILE:?set private backend import token path}:/run/secrets/ai_import_token:ro
      - ${AI_PRODUCTION_BACKEND_CHAT_TOKEN_FILE:?set private backend chat token path}:/run/secrets/hermes_chat_token:ro
    networks:
      default:
      myple_read_production:
        aliases: [myple-production-backend]

networks:
  myple_read_production:
    external: true
    name: myple_read_production
