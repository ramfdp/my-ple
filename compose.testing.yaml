services:
  gateway:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./nginx.testing.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      nginx:
        condition: service_healthy
    restart: unless-stopped
