map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream testing_frontend {
    zone testing_frontend 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server frontend:3000 resolve;
}

upstream testing_api {
    zone testing_api 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server nginx:80 resolve;
}

server {
    listen 80;
    client_max_body_size 2m;

    location ^~ /internal/ai/ { return 404; }
    location = /internal/ai { return 404; }
    location ^~ /api/internal/ai/ { return 404; }
    location = /api/internal/ai { return 404; }
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;

    location /api/ {
        proxy_pass http://testing_api/;
    }

    location / {
        proxy_pass http://testing_frontend;
    }
}
